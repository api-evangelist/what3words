openapi: 3.1.0
info:
  title: what3words Public Autosuggest Available Languages API
  description: 'The what3words API converts between 3 word addresses (e.g. ///filled.count.soap)

    and latitude/longitude coordinates, returns autosuggest candidates, grid

    sections and supported languages.

    '
  version: '3.0'
  contact:
    name: what3words
    url: https://developer.what3words.com/public-api/docs
servers:
- url: https://api.what3words.com/v3
  description: Production
security:
- ApiKeyQuery: []
- ApiKeyHeader: []
tags:
- name: Available Languages
paths:
  /available-languages:
    get:
      summary: List all 3 word address languages supported
      operationId: availableLanguages
      responses:
        '200':
          description: Language list
          content:
            application/json: {}
      tags:
      - Available Languages
components:
  securitySchemes:
    ApiKeyQuery:
      type: apiKey
      in: query
      name: key
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-Api-Key
